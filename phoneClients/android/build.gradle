buildscript {
    ext.kotlin_version = '2.2.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.57.2'
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin:$kotlin_version"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
    delete file('app/release')
}

tasks.register('verifyFast') {
    group = 'verification'
    description = 'Runs the fast verification profile for the Android app.'
    dependsOn(
        ':app:assembleDebug',
        ':app:testDebugUnitTest',
        ':app:jacocoDebugUnitTestCoverageVerification',
        ':app:jacocoCriticalRuntimeCoverageVerification',
        ':app:lintDebug'
    )
}

tasks.register('verifyRelease') {
    group = 'verification'
    description = 'Runs the release verification profile for the Android app.'
    dependsOn(':app:assembleRelease')
}

tasks.register('verifyQualityGates') {
    group = 'verification'
    description = 'Runs the full local verification profile used by CI build gates.'
    dependsOn(
        'verifyFast',
        'verifyRelease',
        ':app:assembleDebugAndroidTest'
    )
}
