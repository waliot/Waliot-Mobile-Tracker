name: Android CI

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'phoneClients/android/**'
    branches: 
      - master
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'phoneClients/android/**'
    branches: 
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoneClients/android

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run build quality gates
      run: ./gradlew verifyQualityGates

    - name: Upload unit test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-unit-test-reports
        path: phoneClients/android/app/build/reports/tests/testDebugUnitTest

    - name: Upload unit test coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-unit-test-coverage
        path: phoneClients/android/app/build/reports/jacoco/jacocoDebugUnitTestReport

    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-lint-reports
        path: phoneClients/android/app/build/reports/lint-results-debug.html

    - name: Upload Gradle problems report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-gradle-problems-report
        path: phoneClients/android/build/reports/problems

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-debug-apk
        path: phoneClients/android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload unsigned release APK
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-release-unsigned-apk
        path: phoneClients/android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload debug androidTest APK
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-debug-androidTest-apk
        path: phoneClients/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: phoneClients/android
      run: chmod +x gradlew

    - name: Run emulator smoke and queue contract tests
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        profile: pixel_7
        disable-animations: true
        script: cd phoneClients/android && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.websmithing.gpstracker2.MainActivitySmokeTest,com.websmithing.gpstracker2.service.TrackingBufferStoreContractTest,com.websmithing.gpstracker2.repository.upload.UploadRepositorySocketContractTest

    - name: Upload connected test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waliot-tracker-connected-test-reports
        path: phoneClients/android/app/build/reports/androidTests/connected
