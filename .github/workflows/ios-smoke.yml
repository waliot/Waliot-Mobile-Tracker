name: iOS Smoke and Coverage

on:
  pull_request:
    paths:
      - '.github/workflows/ios-smoke.yml'
      - 'phoneClients/ios/**'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/ios-smoke.yml'
      - 'phoneClients/ios/**'

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: phoneClients/ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run iOS smoke and coverage gate
        run: ./scripts/run-ios-coverage.sh

      - name: Publish coverage summary
        if: always()
        run: |
          if [[ -f .build/TestResults/coverage-summary.md ]]; then
            cat .build/TestResults/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload xcresult and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-and-coverage
          path: |
            phoneClients/ios/.build/TestResults
          if-no-files-found: ignore
